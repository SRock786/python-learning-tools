[project]
name = "python-learnforge-tools"
version = "0.1.3"
description = "Educational Python practice projects for learning"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "SRock786"}]
dependencies = []

[project.urls]
